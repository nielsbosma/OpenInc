name: CI

# Pull requests: typecheck, lint, tests, then the image is built and tested end to end (not pushed).
# main: the same, then a multi-arch image is pushed as ghcr.io/<owner>/openinc:edge.
# Releases: publishing a GitHub Release named vX.Y.Z (or pushing a vX.Y.Z tag) pushes :X.Y.Z, :X.Y and
# :latest, after an upgrade test from the previous release. The version inside the image is the tag.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

concurrency:
  # A release and its tag push share a group, so they run one after the other instead of racing.
  group: ci-${{ github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openinc

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openinc
          POSTGRES_PASSWORD: openinc
          POSTGRES_DB: openinc_test
        ports: ['5470:5432']
        options: >-
          --health-cmd "pg_isready -U openinc" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://openinc:openinc@localhost:5470/openinc_test
      S3_ENDPOINT: http://localhost:9300
      S3_BUCKET: openinc-test
      S3_ACCESS_KEY: openinc
      S3_SECRET_KEY: openinc-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Start S3 (RustFS)
        run: |
          docker run -d --name s3 -p 9300:9000 -e RUSTFS_ACCESS_KEY=openinc -e RUSTFS_SECRET_KEY=openinc-secret rustfs/rustfs:latest
          for i in $(seq 1 30); do aws --endpoint-url http://localhost:9300 s3 ls >/dev/null 2>&1 && break; sleep 1; done
          aws --endpoint-url http://localhost:9300 s3 mb s3://openinc-test
        env:
          AWS_ACCESS_KEY_ID: openinc
          AWS_SECRET_ACCESS_KEY: openinc-secret
          AWS_DEFAULT_REGION: us-east-1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations are generated from the schema
        run: |
          pnpm db:generate
          git diff --exit-code packages/db/migrations || (echo "The schema changed without a migration. Run pnpm db:generate and commit it." && exit 1)
      - run: pnpm test
      - run: pnpm --filter @openinc/web build-storybook

  image:
    name: Image, end-to-end and upgrade tests
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openinc/web exec playwright install --with-deps chromium

      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          elif [[ -n "$RELEASE_TAG" ]]; then echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT";
          else echo "value=$(node -p "require('./package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3
      - name: Build the image for testing (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openinc:local
          build-args: OPENINC_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Postgres, S3 and Mailpit
        run: |
          docker compose up -d --wait postgres s3 mailpit
          docker compose run --rm s3-init

      - name: Upgrade test, part 1 - install the previous release
        id: previous
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SMTP_HOST: mailpit
          E2E_STAMP: upgrade
          APP_SECRET: local-prod-profile-secret-change-me-0123456789
        run: |
          if ! docker pull "$IMAGE:latest" 2>/dev/null; then echo "No previous release yet; skipping the upgrade test."; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          OPENINC_IMAGE="$IMAGE:latest" docker compose --profile prod up -d --no-build app
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
          pnpm --filter @openinc/web exec playwright test install.spec.ts
          docker compose --profile prod stop app && docker compose --profile prod rm -f app
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Upgrade test, part 2 - the new image migrates it
        if: steps.previous.outputs.ran == 'true'
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_STAMP: upgrade
          E2E_UPGRADE: '1'
        run: |
          OPENINC_IMAGE=openinc:local docker compose --profile prod up -d --no-build app
          pnpm --filter @openinc/web exec playwright test upgrade.spec.ts
          docker compose logs app | tail -50
          docker compose --profile prod stop app && docker compose --profile prod rm -f app

      - name: End-to-end test on a fresh install
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SMTP_HOST: mailpit
          APP_SECRET: local-prod-profile-secret-change-me-0123456789
        run: |
          docker compose exec -T postgres psql -U openinc -d openinc_prod -c "drop schema if exists registry cascade; drop schema if exists public cascade; drop schema if exists pgboss cascade; create schema public;"
          OPENINC_IMAGE=openinc:local docker compose --profile prod up -d --no-build app
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
          pnpm --filter @openinc/web exec playwright test install.spec.ts registry.spec.ts

      - name: Logs and report
        if: failure()
        run: docker compose logs app | tail -200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: latest=auto

      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the multi-arch image (amd64, arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: OPENINC_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
