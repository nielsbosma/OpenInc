# Local development and testing only. Production is the single image plus your own Postgres and S3 bucket.
#
#   pnpm infra:up                         Postgres, S3 (RustFS) and Mailpit for `pnpm dev`
#   docker compose --profile prod up -d   also runs the production image at http://localhost:8080
#
# Mailpit's inbox: http://localhost:8025. S3 (RustFS) at http://localhost:9300 (openinc / openinc-secret).

name: openinc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openinc
      POSTGRES_PASSWORD: openinc
      POSTGRES_DB: openinc
    ports:
      - "5470:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openinc -d openinc"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage for development (RustFS). Production uses any S3 bucket.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: openinc
      RUSTFS_SECRET_KEY: openinc-secret
    ports:
      - "9300:9000"
    volumes:
      - s3:/data

  s3-init:
    image: amazon/aws-cli:latest
    profiles: [tools]
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: openinc
      AWS_SECRET_ACCESS_KEY: openinc-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "for i in $$(seq 1 30); do aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1 && break; sleep 1; done;
      for b in openinc openinc-test openinc-prod; do aws --endpoint-url http://s3:9000 s3 mb s3://$$b 2>/dev/null || true; done; echo buckets ready"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The production image, run the way Sliplane runs it: one container, env vars only.
  app:
    profiles: [prod]
    build: .
    image: ${OPENINC_IMAGE:-openinc:local}
    environment:
      DATABASE_URL: postgres://openinc:openinc@postgres:5432/openinc_prod
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: openinc-prod
      S3_ACCESS_KEY: openinc
      S3_SECRET_KEY: openinc-secret
      S3_REGION: us-east-1
      APP_SECRET: local-prod-profile-secret-change-me-0123456789
      APP_URL: http://localhost:8080
      ROLE: ${OPENINC_ROLE:-all}
    ports:
      - "8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

volumes:
  postgres:
  s3:
