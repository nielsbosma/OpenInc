# Local development and testing only. Production is the single image plus your own Postgres and S3 bucket.
#
#   pnpm infra:up                         Postgres, MinIO (S3) and Mailpit for `pnpm dev`
#   docker compose --profile prod up -d   also runs the production image at http://localhost:8080
#
# Mailpit's inbox: http://localhost:8025. MinIO console: http://localhost:9301 (openinc / openinc-secret).

name: openinc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openinc
      POSTGRES_PASSWORD: openinc
      POSTGRES_DB: openinc
    ports:
      - "5470:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openinc -d openinc"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openinc
      MINIO_ROOT_PASSWORD: openinc-secret
    ports:
      - "9300:9000"
      - "9301:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [tools]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 openinc openinc-secret &&
      mc mb --ignore-existing local/openinc &&
      mc mb --ignore-existing local/openinc-test &&
      mc mb --ignore-existing local/openinc-prod"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The production image, run the way Sliplane runs it: one container, env vars only.
  app:
    profiles: [prod]
    build: .
    image: openinc:local
    environment:
      DATABASE_URL: postgres://openinc:openinc@postgres:5432/openinc_prod
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: openinc-prod
      S3_ACCESS_KEY: openinc
      S3_SECRET_KEY: openinc-secret
      S3_REGION: us-east-1
      APP_SECRET: local-prod-profile-secret-change-me-0123456789
      APP_URL: http://localhost:8080
    ports:
      - "8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres:
  minio:
